<html lang="id"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

.err{text-align:center;color:#dc2626;font-size:.85rem;min-height:1.2em;margin:2px 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}.modal.open{display:flex}

.pics{display:flex;align-items:center;gap:8px}.pics>div{flex:1;min-width:0}.op{font-size:1.6rem}.lb{margin-top:4px}.lb>div{text-align:center}

html{font-size:clamp(16px,.55vw + 10px,40px);-webkit-text-size-adjust:100%}
@media (min-width:1600px){html{font-size:clamp(22px,1.15vw,48px)}}

button{min-height:2.75rem;padding:.4rem .9rem;font-size:1rem}

.app{max-width:min(96vw,64rem);gap:.8rem;padding:0 .6rem}
.pal{width:3.6rem}.pal button{min-height:0;height:2.75rem;padding:0;font-size:.85rem}
.col{width:6.2rem}.col .lab{height:4.2rem}.bar{width:5.4rem}
.mid{width:clamp(4.5rem,15vw,12rem)}.mid svg{width:100%}
.circ{width:3.4rem;height:3.4rem}
.fi input{width:5rem;min-height:2.6rem}.fi hr{width:5rem}
.st i{height:1.4rem}.gr{width:min(18rem,100%)}.res{max-width:min(100%,42rem);font-size:1rem}

.box{width:min(26rem,100%)}.box button{min-height:3rem}
@media (max-width:640px){.app{flex-direction:column;align-items:stretch}.pal{flex-direction:row;flex-wrap:wrap;justify-content:center;width:auto}.pal button{width:3.2rem}.stage{width:100%}}

html{font-size:clamp(12px,min(1.8vh,2.2vw),44px)}

body{--H:clamp(9rem,46vh,40rem)}

.inputs{margin:.4rem 8px 0}.err{min-height:.9rem;margin:0}.col .lab{height:3.4rem}

@media (min-width:700px){.ops:has(#mat){position:absolute;top:.6rem;right:.8rem;margin:0}.hint{display:none}.app{margin:.3rem auto}}
@media (min-width:900px) and (min-aspect-ratio:5/4){

}

#mus button{border:0;background:none;font-size:1.4rem;padding:0 .2rem;min-height:2.4rem}#mus input{width:6rem}
</style></head><body>
<h1 id="ttl">Membandingkan Pecahan</h1><div class="ops"><button id="mat">📚 Pilih materi</button></div>
<p class="sub">Pilih batang (kiri/kanan), lalu klik balok pecahan di samping untuk mengisinya.</p>

 <div class="fi"><small>Pecahan kiri</small><input id="n0" type="number" min="0" max="12" inputmode="numeric" placeholder="pembilang"><hr><input id="d0" type="number" min="1" max="12" inputmode="numeric" placeholder="penyebut"></div>

</div>

<div class="app">

  </div>
  <div class="ops" id="cmpops">

  </div>
  <div class="msg" id="msg"></div><div class="res" id="res" style="display:none"></div>

 </div>
</div>
<p class="hint">Klik kotak di dalam batang untuk mengisi / mengosongkan sampai kotak itu. Klik batang untuk memilihnya.</p>
<div id="mus"><button id="sbtn" title="Efek suara" aria-label="Efek suara">🔔</button><button id="mbtn" title="Musik latar" aria-label="Musik latar">🔇</button><input id="vol" type="range" min="0" max="100" value="50" aria-label="Volume"></div>
<div class="modal" id="modal"><div class="box"><h2>Pilih Materi</h2><p>Pilih topik pecahan yang ingin dipelajari</p><div id="menu"></div></div></div>
<script>
var D=[[1,'1','#e53935'],[2,'½','#ec4f8a'],[3,'⅓','#fb8c00'],[4,'¼','#fdd835'],[5,'⅕','#43a047'],[6,'⅙','#1e88e5'],[8,'⅛','#3949ab'],[10,'1/10','#8e24aa'],[12,'1/12','#555']];
var col={7:'#00897b',9:'#6d4c41',11:'#c0792b'};D.forEach(function(d){col[d[0]]=d[2]});
var B=[{d:4,n:3},{d:0,n:0}],act=0,guess=null,line=false;
var pal=document.getElementById('pal');
D.forEach(function(d){var b=document.createElement('button');b.style.background=d[2];if(d[0]==4)b.style.color='#111';
 b.innerHTML=d[0]==1?'1':'1/'+d[0];b.onclick=function(){add(d[0])};pal.appendChild(b)});
function add(d){var b=B[act];if(b.d!=d){b.d=d;b.n=0}if(b.n<b.d)b.n++;sfx([520+b.n*40]);guess=null;render()}
var P=[[3,5,7,10],[3,4,4,6],[6,8,9,12]],pr=document.getElementById('presets');
P.forEach(function(p){var b=document.createElement('button');b.textContent=p[0]+'/'+p[1]+' vs '+p[2]+'/'+p[3];
 b.onclick=function(){B=[{d:p[1],n:p[0]},{d:p[3],n:p[2]}];guess=null;render()};pr.appendChild(b)});
[0,1].forEach(function(i){document.getElementById('c'+i).onclick=function(){sfx([392],'triangle');act=i;render()}});
document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){guess=b.dataset.s;sfx(guess==cmp()?[659,880]:[196]);render()}});
document.getElementById('gar').onclick=function(){line=!line;sfx([line?640:420]);render()};
document.getElementById('rst').onclick=function(){sfx([330,262,196],'triangle');['n0','d0','n1','d1'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('err').textContent='';B=[{d:0,n:0},{d:0,n:0}];guess=null;line=false;render()};
function syncInp(){[0,1].forEach(function(i){var ne=document.getElementById('n'+i),de=document.getElementById('d'+i);
 if(!B[i].d&&(ne.value!==''||de.value!==''))return;
 if(document.activeElement!==ne)ne.value=B[i].d?B[i].n:'';
 if(document.activeElement!==de)de.value=B[i].d?B[i].d:''})}
function readInp(i){var ne=document.getElementById('n'+i).value,de=document.getElementById('d'+i).value,er=document.getElementById('err'),d=parseInt(de,10),n=parseInt(ne,10)||0;er.textContent='';
 if(de===''){B[i]={d:0,n:0}}
 else if(!(d>=1&&d<=12)){er.textContent='Penyebut harus bilangan bulat 1 sampai 12.';return}
 else{if(n<0)n=0;if(n>d){n=d;er.textContent='Pembilang tidak boleh lebih besar dari penyebut (maksimal 1 utuh).'}B[i]={d:d,n:n}}
 sfx([500],'triangle');act=i;guess=null;render()}
[0,1].forEach(function(i){['n','d'].forEach(function(k){var el=document.getElementById(k+i);el.oninput=function(){readInp(i)};el.onchange=function(){readInp(i)};el.onfocus=function(){act=i;document.getElementById('c0').className='col'+(act==0?' act':'');document.getElementById('c1').className='col'+(act==1?' act':'')}})});

  el.className='col'+(act==i?' act':'');
  var lab=b.d?'<span>'+b.n+'</span><i>'+b.d+'</i>':'<span style="color:var(--mut)">?</span>';
  var t='';for(var k=1;k<=b.d;k++){var f=k<=b.n;
   t+='<div class="t'+(f?' f':'')+'" data-i="'+i+'" data-k="'+k+'" '+(f?'style="background:'+col[b.d]+(b.d==4?';color:#111':'')+'"':'')+'>1/'+b.d+'</div>'}
  el.innerHTML='<div class="lab">'+lab+'</div><div class="bar">'+t+'</div>'});
 document.querySelectorAll('.t').forEach(function(t){t.onclick=function(e){e.stopPropagation();
  var i=+t.dataset.i,k=+t.dataset.k,fill=k>B[i].n;sfx(fill?[300+k*45]:[460-k*25],fill?'sine':'triangle');act=i;B[i].n=(k<=B[i].n)?k-1:k;guess=null;render()}});
 var c=cmp(),m=document.getElementById('msg'),ci=document.getElementById('circ');
 ci.textContent=guess||'';m.className='msg';m.textContent='';
 if(c===null){if(guess){m.textContent='Isi kedua batang dulu.'}}
 else if(guess){var ok=guess==c;m.className='msg '+(ok?'ok':'no');
  m.textContent=ok?'Benar! '+B[0].n+'/'+B[0].d+({'<':' kurang dari ','>':' lebih dari ','=':' sama dengan '}[c])+B[1].n+'/'+B[1].d:'Belum tepat, coba lagi.'}
 var s=document.getElementById('ln');s.innerHTML='';
 if(line&&c!==null){var H=document.querySelector('.bar').offsetHeight;
  var y0=H*(1-B[0].n/B[0].d)+2,y1=H*(1-B[1].n/B[1].d)+2;
  var W=document.querySelector('.mid').offsetWidth;s.innerHTML='<line x1="0" y1="'+y0+'" x2="'+W+'" y2="'+y1+'" stroke="currentColor" stroke-width="2.5"/><circle cx="0" cy="'+y0+'" r="5" fill="#2f80ed"/><circle cx="'+W+'" cy="'+y1+'" r="5" fill="#2f80ed"/>';
  s.style.color='var(--line)'}
 document.getElementById('gar').className=line?'on':'';opsView();
}
var mode='intro',SYM={add:'+',sub:'−',mul:'×',div:'÷'},NAME={intro:'Pengenalan Pecahan',cmp:'Membandingkan Pecahan',add:'Penjumlahan Pecahan',sub:'Pengurangan Pecahan',mul:'Perkalian Pecahan',div:'Pembagian Pecahan'};
function g(a,b){return b?g(b,a%b):a}
function F(n,d){return '<span class="fr"><b>'+n+'</b><b>'+d+'</b></span>'}
function strips(n,q){var h='',l=n,r=0;do{h+='<div class="st">';for(var k=1;k<=q;k++)h+='<i'+(k<=l?' class="f"':'')+'></i>';h+='</div>';l-=q;r++}while(l>0&&r<6);return h}
function opsView(){var cm=mode=='cmp',a=B[0],b=B[1],res=document.getElementById('res');
 document.getElementById('ttl').textContent=NAME[mode];
 document.getElementById('cmpops').style.display=cm?'':'none';document.getElementById('gar').style.display=cm?'':'none';
 res.style.display=cm?'none':'';
 var it=mode=='intro';document.getElementById('c1').style.display=it?'none':'';document.querySelector('.mid').style.display=it?'none':'';var ii=document.querySelectorAll('.inputs>*');ii[1].style.display=ii[2].style.display=it?'none':'';
 if(it){act=0;res.innerHTML=intro(B[0]);return}
 if(cm)return;
 document.getElementById('circ').textContent=SYM[mode];document.getElementById('msg').textContent='';document.getElementById('ln').innerHTML='';
 if(!a.d||!b.d){res.innerHTML='<p>Isi kedua pecahan untuk melihat langkah penyelesaian.</p>';return}
 var n,d,h='',s=SYM[mode];var L=a.d*b.d/g(a.d,b.d),x=a.n*L/a.d,y=b.n*L/b.d;
 if(mode=='add'||mode=='sub'){var L=a.d*b.d/g(a.d,b.d),x=a.n*L/a.d,y=b.n*L/b.d;n=mode=='add'?x+y:x-y;d=L;
  h+='<p>1. Samakan penyebut (KPK '+a.d+' dan '+b.d+' = '+L+'): '+F(a.n,a.d)+'='+F(x,L)+' dan '+F(b.n,b.d)+'='+F(y,L)+'</p><p>2. '+(mode=='add'?'Jumlahkan':'Kurangkan')+' pembilang: '+F(x,L)+s+F(y,L)+'='+F(n,L)+'</p>'}
 else if(mode=='mul'){n=a.n*b.n;d=a.d*b.d;h+='<p>1. Kalikan pembilang dan penyebut: '+F(a.n,a.d)+'×'+F(b.n,b.d)+'='+F(n,d)+'</p>'}
 else{if(!b.n){res.innerHTML='<p class="no">Tidak bisa dibagi dengan 0.</p>';return}n=a.n*b.d;d=a.d*b.n;h+='<p>1. Balik pecahan kedua, lalu kalikan: '+F(a.n,a.d)+'×'+F(b.d,b.n)+'='+F(n,d)+'</p>'}
 h=viz(mode,a,b,L,x,y)+h;var k=g(Math.abs(n),d)||1,sn=n/k,sd=d/k;
 h+='<p><b>Hasil:</b> '+F(sn,sd)+(k>1?' (disederhanakan dari '+F(n,d)+')':'')+(n>=0&&sd>1&&sn>sd?' = '+Math.floor(sn/sd)+' '+F(sn%sd,sd):'')+'</p>';

function row(q,f){var h='<div class="st">';for(var k=1;k<=q;k++){var c=f(k);h+='<i'+(c?' style="background:'+c+'"':'')+'></i>'}return h+'</div>'}
function cap(t){return '<div class="cap">'+t+'</div>'}
var st=1;function setSt(k){if(k!=st)sfx(k==4?[523,659,784,1047]:k>st?[400+k*60]:[560-k*40]);st=k;opsView()}
function pic(o,d,n,m,sp,c){var W=200,H=100,s='<svg viewBox="0 0 200 100" style="width:100%;display:block"><rect width="200" height="100" fill="#fff"/>';
 s+=o=='c'?'<rect width="'+W*n/d+'" height="100" fill="'+c+'" fill-opacity=".7"/>':'<rect width="200" height="'+H*n/d+'" fill="'+c+'" fill-opacity=".7"/>';
 if(sp)for(var j=1;j<m;j++)s+=o=='c'?'<line x1="0" x2="200" y1="'+H*j/m+'" y2="'+H*j/m+'" stroke="#e53935"/>':'<line y1="0" y2="100" x1="'+W*j/m+'" x2="'+W*j/m+'" stroke="#e53935"/>';
